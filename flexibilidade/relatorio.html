<script>
'use strict';
(function () {
  var CHAVE_LOCAL = 'matchit:nuvem:' + (location.pathname || '');
  var porta = document.getElementById('porta');
  var forma = document.getElementById('forma');
  var campo = document.getElementById('senha');
  var botao = document.getElementById('botao');
  var erro = document.getElementById('erro');
  var lembrar = document.getElementById('lembrar');
  var quadro = document.getElementById('quadro');
  var selo = document.getElementById('selo');

  function bytes(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function aad(texto) { return new TextEncoder().encode(texto); }

  async function descomprime(dados, comp) {
    if (comp !== 'gzip') return new TextDecoder().decode(dados);
    if (typeof DecompressionStream === 'undefined')
      throw new Error('navegador antigo demais para abrir este arquivo (atualize o navegador)');
    var fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(fluxo).text();
  }

  // Envelope: o documento é cifrado uma única vez com uma chave aleatória (CEK);
  // cada senha embrulha essa mesma CEK. O salt do PBKDF2 é comum aos embrulhos,
  // então cada tentativa de senha custa UMA derivação; a senha que abrir define
  // o modo (leitura ou admin). O AAD amarra cada embrulho ao seu papel/arquivo.
  async function abrir(senha) {
    var p = JSON.parse(document.getElementById('enc').textContent);
    var material = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    var chaveSenha = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(p.salt), iterations: p.iter, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (var i = 0; i < p.chaves.length; i++) {
      var ch = p.chaves[i];
      var ckBruta;
      try {
        ckBruta = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: bytes(ch.iv), additionalData: aad('matchit/v2/chave/' + ch.modo + '/' + p.arquivo) },
          chaveSenha, bytes(ch.ct));
      } catch (e) { continue; }  // senha não abre este embrulho: tenta o próximo
      var ck = await crypto.subtle.importKey('raw', ckBruta, { name: 'AES-GCM' }, false, ['decrypt']);
      var doc = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(p.doc.iv), additionalData: aad('matchit/v2/conteudo/' + p.arquivo) },
        ck, bytes(p.doc.ct));
      return { modo: ch.modo, html: await descomprime(new Uint8Array(doc), p.comp) };
    }
    return null;
  }

  window.NUVEM = {
    sair: function () {
      try { localStorage.removeItem(CHAVE_LOCAL); } catch (e) {}
      location.reload();
    }
  };
  document.getElementById('sair').addEventListener('click', window.NUVEM.sair);

  function mostra(resultado) {
    var marca = '<script id="marca-nuvem">window.MODO_NUVEM=' + JSON.stringify(resultado.modo) + ';<\/script>';
    var html = resultado.html;
    var posCabeca = html.indexOf('<head>');
    html = posCabeca >= 0 ? html.slice(0, posCabeca + 6) + marca + html.slice(posCabeca + 6) : marca + html;

    porta.classList.add('oculto');
    quadro.style.display = 'block';
    var d = quadro.contentDocument || quadro.contentWindow.document;
    d.open(); d.write(html); d.close();

    document.getElementById('selo-modo').innerHTML =
      resultado.modo === 'admin' ? '✏️ <b>modo admin</b>' : '👁 <b>somente leitura</b>';
    selo.style.display = 'flex';
    document.title = (quadro.contentDocument && quadro.contentDocument.title) || document.title;
  }

  async function tenta(senha, silencioso) {
    if (!senha) return false;
    botao.disabled = true;
    erro.textContent = silencioso ? '' : 'Verificando…';
    try {
      var r = await abrir(senha);
      if (!r) {
        erro.textContent = silencioso ? '' : 'Senha incorreta.';
        botao.disabled = false;
        return false;
      }
      if (lembrar.checked || silencioso) {
        try { localStorage.setItem(CHAVE_LOCAL, senha); } catch (e) {}
      }
      mostra(r);
      return true;
    } catch (e) {
      erro.textContent = 'Não foi possível abrir: ' + (e && e.message ? e.message : e);
      botao.disabled = false;
      return false;
    }
  }

  forma.addEventListener('submit', function (ev) { ev.preventDefault(); tenta(campo.value, false); });

  if (!window.crypto || !crypto.subtle) {
    erro.textContent = 'Este navegador não suporta a decifragem (use HTTPS e um navegador atual).';
  } else {
    var guardada = null;
    try { guardada = localStorage.getItem(CHAVE_LOCAL); } catch (e) {}
    if (guardada) { lembrar.checked = true; tenta(guardada, true).then(function (ok) { if (!ok) campo.focus(); }); }
    else campo.focus();
  }
})();
</script>
